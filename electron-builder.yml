appId: com.leejun51.investingwidget
productName: InvestingWidget
# Task Manager의 "이름" 컬럼은 exe VersionInfo의 FileDescription을 표시.
# electron-builder는 기본적으로 package.json의 description을 FileDescription으로 박음
# → extraMetadata로 빌드 시점에만 짧은 이름으로 덮어씀 (npm 메타데이터 description은 그대로 유지).
extraMetadata:
  description: InvestingWidget
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - '!**/{.DS_Store,*.map}'
# extraResources는 asar 외부의 런타임 리소스. process.resourcesPath/icon.ico 로 접근.
# BrowserWindow({icon}) 가 실행 중일 때 작업표시줄·Alt+Tab 아이콘으로 사용.
extraResources:
  - from: resources/icon.ico
    to: icon.ico
asar: true
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
# artifactName — 빈 칸 없는 파일명으로 통일. electron-updater 의 latest.yml 이
# url 필드에 이 이름 그대로 사용 → 자동 업데이트 다운로드 URL 안정성.
artifactName: ${productName}-Setup-${version}.${ext}
# 빌드 산출물 압축 — installer 크기·delta update 효율 ↑.
compression: maximum
# NSIS 인스톨러 옵션 — 마법사형 + per-user (관리자 권한 불필요).
# 설치 경로: %LOCALAPPDATA%\Programs\InvestingWidget. 사용자가 마법사에서 변경 가능.
# allowElevation:false — admin/user 선택 페이지 제거 (per-user 만)
# createDesktopShortcut/createStartMenuShortcut:false + custom installer.nsh 의 Components 페이지로 사용자 직접 선택
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  shortcutName: InvestingWidget
  include: build/installer.nsh
# electron-updater 가 GitHub Releases 의 latest.yml 로 새 버전 감지.
# 빌드 시 release/latest.yml 자동 생성, gh release create 시 .exe 와 함께 첨부 필요.
publish:
  provider: github
  owner: Seober
  repo: InvestingWidget
