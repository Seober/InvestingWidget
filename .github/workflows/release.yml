name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 동시 release 충돌 방지 — 같은 ref 의 진행 중 빌드는 cancel.
# tag push 가 반복되면 마지막 tag 의 빌드만 release 발행.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Patch-package guard (CI fail-fast 시 critical safety fix 미적용 차단)
        run: node scripts/check-patch-applied.mjs

      - name: Tag-vs-package.json version guard (push trigger 만)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $pkgVersion) {
            Write-Error "Tag version ($tagVersion) != package.json version ($pkgVersion). 둘 일치시킨 후 재태그."
            exit 1
          }
          Write-Host "Version match OK: v$pkgVersion"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
        env:
          SKIP_NETWORK_TESTS: '1'

      - name: Build (electron-vite)
        run: npx electron-vite build

      - name: Package (tag push → publish, manual → artifact only)
        run: npx electron-builder --win --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wrap .exe in zip (Edge SmartScreen 다운로드 차단 우회용)
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $exe = "release/InvestingWidget-Setup-$($pkg.version).exe"
          $zip = "release/InvestingWidget-Setup-$($pkg.version).zip"
          if (-not (Test-Path $exe)) { Write-Error "Expected $exe not found"; exit 1 }
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          Write-Host "Wrapped: $zip"

      - name: Upload zip to release (tag push 만)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $zip = "release/InvestingWidget-Setup-$($pkg.version).zip"
          gh release upload "v$($pkg.version)" $zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (수동 trigger 검증용)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/*.blockmap
